[project]
name = "arbscan"
version = "0.1.0"
description = "Read-only football arbitrage scanner: net-of-fee detection, lifetime and depth logging, go/no-go gates"
readme = "docs/09-scanner.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["pandas>=2.2", "numpy>=1.26"]

[project.scripts]
arbscan = "arbscan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
